name: MinePlugin
version: 6.0.0
main: com.mine.plugin.MinePlugin
api-version: '1.21.11'
description: Полная система государства

commands:
  kazna:
    description: Открыть казну города
    usage: /kazna
    permission: mine.kazna
  buy:
    description: Магазин ресурсов
    usage: /buy
    permission: mine.buy
  credit:
    description: Кредитная система
    usage: /credit <take|info|pay> [сумма]
    permission: mine.credit
  passport:
    description: Паспорт гражданина
    usage: /passport
    permission: mine.passport
  property:
    description: Имущество
    usage: /property
    permission: mine.property
  top:
    description: Таблицы лидеров
    usage: /top <mine|tax|visit|ach> [кол-во]
    permission: mine.top
  ach:
    description: Достижения
    usage: /ach
    permission: mine.achievements
  minereload:
    description: Перезагрузить конфиг
    usage: /minereload
    permission: mine.admin

permissions:
  mine.kazna:
    default: true
  mine.use:
    default: true
  mine.buy:
    default: true
  mine.credit:
    default: true
  mine.passport:
    default: true
  mine.property:
    default: true
  mine.top:
    default: true
  mine.achievements:
    default: true
  mine.admin:
    default: op
