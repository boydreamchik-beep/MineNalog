name: MinePlugin
version: 4.0.0
main: com.mine.plugin.MinePlugin
api-version: '1.21'
description: Шахта, казна, магазин, кредиты, паспорт. Всё через конфиги.

commands:
  kazna:
    description: Открыть казну города
    usage: /kazna
    permission: mine.kazna
  buy:
    description: Открыть магазин ресурсов
    usage: /buy
    permission: mine.buy
  credit:
    description: Кредитная система
    usage: /credit <take|info|pay> [сумма]
    permission: mine.credit
  passport:
    description: Получить паспорт гражданина
    usage: /passport [Фамилия] [Имя] [Отчество]
    permission: mine.passport
  minereload:
    description: Перезагрузить конфиг плагина
    usage: /minereload
    permission: mine.admin

permissions:
  mine.kazna:
    description: Доступ к казне
    default: true
  mine.use:
    description: Использование шахты
    default: true
  mine.buy:
    description: Доступ к магазину
    default: true
  mine.credit:
    description: Доступ к кредитам
    default: true
  mine.passport:
    description: Получение паспорта
    default: true
  mine.admin:
    description: Админ-команды плагина
    default: op
